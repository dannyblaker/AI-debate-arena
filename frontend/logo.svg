<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="pro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3be084"/>
      <stop offset="1" stop-color="#23b562"/>
    </linearGradient>
    <linearGradient id="con" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#f0543d"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a98cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- PRO speech bubble, upper left, tail outward -->
  <path fill="url(#pro)" d="
    M 38 24
    h 80 a 18 18 0 0 1 18 18
    v 48 a 18 18 0 0 1 -18 18
    h -52 l -30 26 l 8 -26
    a 18 18 0 0 1 -24 -18
    v -48 a 18 18 0 0 1 18 -18 z"/>

  <!-- CON speech bubble, lower right, tail outward -->
  <path fill="url(#con)" d="
    M 218 232
    h -80 a 18 18 0 0 1 -18 -18
    v -48 a 18 18 0 0 1 18 -18
    h 52 l 30 -26 l -8 26
    a 18 18 0 0 1 24 18
    v 48 a 18 18 0 0 1 -18 18 z"/>

  <!-- debate lines inside the bubbles -->
  <g stroke="#0e1117" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="44" y1="52" x2="112" y2="52"/>
    <line x1="44" y1="80" x2="90" y2="80"/>
    <line x1="144" y1="176" x2="212" y2="176"/>
    <line x1="166" y1="204" x2="212" y2="204"/>
  </g>

  <!-- the clash: judge's bolt through the centre channel -->
  <path fill="url(#bolt)" stroke="#0e1117" stroke-width="8" stroke-linejoin="round"
        d="M 142 58 L 72 142 h 49 l -7 56 l 70 -84 h -49 z"/>
</svg>
