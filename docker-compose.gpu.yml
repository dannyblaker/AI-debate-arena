# GPU override. Needs an NVIDIA GPU and the NVIDIA Container Toolkit
# (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/).
# Run with:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
services:
  ai-debate:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        # Compute capability of your GPU without the dot (8.6 -> "86");
        # find it with: nvidia-smi --query-gpu=compute_cap --format=csv
        # Use "all-major" to build a portable (but several GB larger) image.
        CUDA_ARCHS: "86"
    environment:
      # -1 offloads every model layer to the GPU; lower it (e.g. 20) if the
      # model doesn't fit in VRAM and you want a CPU/GPU split.
      - N_GPU_LAYERS=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
